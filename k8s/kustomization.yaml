apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - namespace.yaml
  - otel-collector.yaml
  - prometheus.yaml
  - loki.yaml
  - tempo.yaml
  - grafana.yaml

configMapGenerator:
  - name: otel-collector-config
    files:
      - otel-collector-config.yaml=config/otel-collector-config.yaml
  - name: prometheus-config
    files:
      - prometheus.yml=config/prometheus.yml
  - name: loki-config
    files:
      - loki.yaml=config/loki.yaml
  - name: tempo-config
    files:
      - tempo.yaml=config/tempo.yaml
  - name: grafana-datasources
    files:
      - datasources.yaml=config/datasources.yaml
  - name: grafana-dashboards-provider
    files:
      - dashboards.yaml=config/dashboards.yaml
  - name: grafana-dashboards
    files:
      - manual-python.json=config/dashboards/manual-python.json
      - manual-python-metrics.json=config/dashboards/manual-python-metrics.json
      - manual-python-logs.json=config/dashboards/manual-python-logs.json
      - shop-site.json=config/dashboards/shop-site.json
      - zero-code-node.json=config/dashboards/zero-code-node.json

generatorOptions:
  disableNameSuffixHash: true
